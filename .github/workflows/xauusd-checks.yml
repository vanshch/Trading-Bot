name: XAU/USD alert bot checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      TESTING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py alerts.py config.py feed.py screenshots.py test_chart_delivery.py
      - run: python -m unittest discover -s tests -p test_alerts.py
      - run: python -m unittest discover -s tests -p test_screenshots.py
      - run: python -m unittest discover -s tests -p test_chart_scheduler.py
