steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trade-monitoring-bot:$BUILD_ID', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trade-monitoring-bot:$BUILD_ID']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trade-monitoring-bot:$BUILD_ID'

substitutions:
  _REGION: 'asia-south1'
  _REPOSITORY: 'trade-bots'
