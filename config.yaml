audio:
  model: whisper-large-v3-turbo
  chunk_duration_seconds: 10.0
  context_buffer_seconds: 120
  language: hi
  initial_prompt: Gold, XAUUSD, BTC, Bitcoin, Forex, Order Block, FVG, Liquidity, Entry, SL, TP, Target, Buy, Sell, Long, Short, Call, Put, Breakout.
  temperature: 0.0
  timeout_seconds: 10.0
  max_retries: 3
  retry_delay_seconds: 1.0
capture:
  frame_interval_seconds: 5.0
  live_poll_interval_seconds: 60.0
  stream_timeout_seconds: 15.0
  max_consecutive_stream_errors: 5
cv_filter:
  min_line_length_ratio: 0.1
  max_line_angle_degrees: 5.0
  roi_crop:
    top: 0.1
    bottom: 0.8
    left: 0.1
    right: 0.9
  blue_hsv_ranges:
  - lower:
    - 95
    - 80
    - 80
    upper:
    - 135
    - 255
    - 255
  red_hsv_ranges:
  - lower:
    - 0
    - 80
    - 80
    upper:
    - 10
    - 255
    - 255
  - lower:
    - 170
    - 80
    - 80
    upper:
    - 180
    - 255
    - 255
  morph_kernel_width: 15
  morph_kernel_height: 1
  hough_threshold: 25
  hough_min_line_length: 30
  hough_max_line_gap: 10
ai:
  model_name: gemini-3.6-flash
  confidence_threshold: 0.7
  max_retries: 3
  retry_delay_seconds: 2.0
  timeout_seconds: 15.0
telegram:
  include_screenshot: true
  caption_timezone: Asia/Kolkata
  max_retries: 3
  retry_delay_seconds: 2.0
  timeout_seconds: 10.0
