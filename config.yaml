cv_filter:
  min_line_length_ratio: 0.1
  max_line_angle_degrees: 5.0
  chart_boundary_ratio: 0.2
  hsv_blue_lower:
  - 100
  - 150
  - 50
  hsv_blue_upper:
  - 140
  - 255
  - 255
  hsv_red_lower1:
  - 0
  - 150
  - 50
  hsv_red_upper1:
  - 10
  - 255
  - 255
  hsv_red_lower2:
  - 170
  - 150
  - 50
  hsv_red_upper2:
  - 180
  - 255
  - 255
  canny_threshold1: 50
  canny_threshold2: 150
  hough_rho: 1
  hough_theta: 0.017453292519943295
  hough_threshold: 50
  hough_min_line_length: 30
  hough_max_line_gap: 10
ai:
  model_name: gemini-3.7-flash
  # Progressive fallback: Best multimodal models down to smaller text models.
  # Groq is placed strictly LAST to preserve API quotas for Audio Speech-to-Text (Whisper).
  fallback_models:
  - {provider: gemini, model: gemini-3.6-flash}
  - {provider: gemini, model: gemini-2.5-flash}
  - {provider: sambanova, model: DeepSeek-V3.2}
  - {provider: sambanova, model: gpt-oss-120b}
  - {provider: sambanova, model: Meta-Llama-3.3-70B-Instruct}
  - {provider: openrouter, model: nvidia/nemotron-3-super-120b-a12b:free}
  - {provider: openrouter, model: nvidia/nemotron-3-ultra-550b-a55b:free}
  - {provider: openrouter, model: nvidia/nemotron-3.5-lightning:free}
  - {provider: openrouter, model: google/gemma-4-31b-it:free}
  - {provider: openrouter, model: liquid/lfm-2.5-2.6b:free}
  - {provider: cerebras, model: gpt-oss-120b}
  - {provider: groq, model: openai/gpt-oss-120b}
  - {provider: groq, model: qwen/qwen3.8-27b}
  - {provider: groq, model: openai/gpt-oss-20b}
  rate_limit_cooldown_seconds: 60
  daily_quota_cooldown_seconds: 86400
  failure_cooldown_seconds: 30
  verification_timeout_seconds: 60
  confidence_threshold: 0.7
  max_retries: 3
  retry_delay_seconds: 2.0
  timeout_seconds: 15.0
news:
  enabled: true
  feed_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  schedule_times:
  - '08:00'
  - '14:00'
  timezone: Asia/Kolkata
  impact_levels:
  - High
  pre_event_alert_enabled: true
  pre_event_minutes: 30
  poll_interval_seconds: 30.0
  timeout_seconds: 15.0
  max_retries: 3
  retry_delay_seconds: 3.0
  rate_limit_cooldown_seconds: 900.0
  min_retry_interval_seconds: 300.0
telegram:
  include_screenshot: false
  caption_timezone: Asia/Kolkata
capture:
  screenshots_enabled: false
  frame_interval_seconds: 5.0
  live_poll_interval_seconds: 60.0
